# Tiny Tapeout project information
#   ->  replaces info.yaml at the repo root
project:
  title:        "RV32I ALU"
  author:       "Banu Rohit Vutukuri"
  discord:      ""                     # optional - fill in if you are on the TT Discord
  description:  "Formally verified RV32I ALU with a byte-addressed register interface"
  language:     "SystemVerilog"
  clock_hz:     10000000               # 10 MHz - see note in the chat about why this is low

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"    # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_vutukuri_rv32i_alu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_vutukuri_rv32i_alu.sv"
    - "alu.sv"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "DIN0"
  ui[1]: "DIN1"
  ui[2]: "DIN2"
  ui[3]: "DIN3"
  ui[4]: "DIN4"
  ui[5]: "DIN5"
  ui[6]: "DIN6"
  ui[7]: "DIN7"

  # Outputs
  uo[0]: "DOUT0"
  uo[1]: "DOUT1"
  uo[2]: "DOUT2"
  uo[3]: "DOUT3"
  uo[4]: "DOUT4"
  uo[5]: "DOUT5"
  uo[6]: "DOUT6"
  uo[7]: "DOUT7"

  # Bidirectional pins
  uio[0]: "ADDR0"
  uio[1]: "ADDR1"
  uio[2]: "ADDR2"
  uio[3]: "ADDR3"
  uio[4]: "WE"
  uio[5]: "RSEL0"
  uio[6]: "RSEL1"
  uio[7]: "ZERO"

# Do not change!
yaml_version: 6
